# Crea etiquetas, hitos con fechas e issues iniciales a partir de
# .github/proyecto/plan.yml. Normalmente lo hace el director con
# `scripts/proyecto/tablero.py alta` (que además crea el tablero), pero
# también se puede lanzar desde aquí: Actions → Inicializar proyecto → Run
# workflow. Es seguro volver a ejecutarlo (p. ej. para mover las fechas).
name: Inicializar proyecto

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Fecha de inicio (AAAA-MM-DD)"
        required: true
      semanas:
        description: "Semanas hasta la defensa (TFG ≈ 36, TFM ≈ 24)"
        required: true
        default: "36"
      solo_hitos:
        description: "Crear solo etiquetas e hitos (sin issues)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  inicializar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyyaml
      - name: Crear etiquetas, hitos e issues
        env:
          GH_TOKEN: ${{ github.token }}
          INICIO: ${{ inputs.inicio }}
          SEMANAS: ${{ inputs.semanas }}
          SOLO_HITOS: ${{ inputs.solo_hitos }}
        shell: bash   # activa pipefail: si el script falla, falla el paso
        run: |
          ARGS=(--inicio "$INICIO" --semanas "$SEMANAS")
          if [ "$SOLO_HITOS" = "true" ]; then ARGS+=(--sin-issues); fi
          python3 scripts/proyecto/inicializar.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
